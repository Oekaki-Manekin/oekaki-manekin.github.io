<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 検索の入口はLP（/）に一本化する。このページは操作画面のみでテキストを持たないため
         インデックス対象から外す。follow は残すので、ここからLPへのリンク評価は通る。
         ※robots.txt が Disallow: / の間はクロール自体が行われないため、この指定が効くのは
           公開当日に robots.txt を Allow: / へ切り替えた後。 -->
    <meta name="robots" content="noindex, follow" />

    <title>お絵かき招金（まねきん）｜無料3Dポーザー</title>
    <meta name="description" content="お絵かき招金（まねきん）の操作画面。マネキンとVRMにポーズを付けて、PNGで書き出せる無料ブラウザ3Dポーザーです。" />

    <!-- OGP：インデックスはしないが、URLが直接シェアされたときのカード表示に使う -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="お絵かき招金" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="お絵かき招金（まねきん）｜無料3Dポーザー" />
    <meta property="og:description" content="インストール不要・登録不要。マネキンとVRMにポーズを付けてPNG書き出し。絵描きのためのポーズ資料作成ツール。" />
    <meta property="og:url" content="https://oekaki-manekin.github.io/app/" />
    <meta property="og:image" content="https://oekaki-manekin.github.io/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="お絵かき招金（まねきん）── 絵描きのための無料ブラウザ3Dポーザー。VRM対応・インストール不要。操作ハンドルを表示したマネキンの画面と、そのポーズから描き起こしたイラストを並べた画像" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- twitter:site は意図的に置いていない。ポーザーの表にXのIDを出さない方針のため（2026-09-03決定） -->

    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
